name = "ml-species-predictor"
main = "ml-species-predictor.js"
compatibility_date = "2024-01-01"
workers_dev = true

# D1 Database binding
[[d1_databases]]
binding = "BGAPP_DATA"
database_name = "bgapp-data"
database_id = "46ed7435-1b25-498d-b832-7bef98061df3"

# KV Namespace binding for model caching
[[kv_namespaces]]
binding = "BGAPP_KV"
id = "c7969eba99d2477d897608e71ceb9f56"

# Environment variables
[vars]
MODEL_VERSION = "v1.0.0-species-classifier"
ALLOWED_ORIGINS = "https://bgapp-admin.pages.dev,https://bgapp-realtime.pages.dev,https://bgapp-frontend.pages.dev"

# Route configuration
routes = [
  { pattern = "ml-species-predictor.majearcasa.workers.dev", zone_name = "majearcasa.workers.dev" }
]

# Limits and performance
limits = { cpu_ms = 50 }

# Observability
observability = { enabled = true }
