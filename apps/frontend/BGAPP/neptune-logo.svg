<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Neptune Logo SVG - Versão Simplificada -->
  <defs>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1929;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo externo -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#oceanGradient)" stroke-width="3"/>
  
  <!-- Background escuro -->
  <circle cx="100" cy="100" r="92" fill="url(#darkGradient)"/>
  
  <!-- Ondas oceânicas (camadas) -->
  <path d="M 10 140 Q 50 130, 100 140 T 190 140 L 190 190 L 10 190 Z" fill="#4facfe" opacity="0.3"/>
  <path d="M 10 155 Q 50 145, 100 155 T 190 155 L 190 190 L 10 190 Z" fill="#4facfe" opacity="0.5"/>
  <path d="M 10 170 Q 50 160, 100 170 T 190 170 L 190 190 L 10 190 Z" fill="#4facfe" opacity="0.7"/>
  
  <!-- Barco -->
  <g transform="translate(80, 120)">
    <!-- Casco -->
    <path d="M 0 10 L 5 20 L 35 20 L 40 10 Z" fill="#2d5a7b"/>
    <rect x="5" y="5" width="30" height="5" fill="#2d5a7b"/>
    <!-- Cabine -->
    <rect x="15" y="0" width="10" height="8" fill="#1e3a5f"/>
    <!-- Cruz (antena) -->
    <line x1="20" y1="-5" x2="20" y2="0" stroke="#4facfe" stroke-width="1"/>
    <line x1="17" y1="-3" x2="23" y2="-3" stroke="#4facfe" stroke-width="1"/>
  </g>
  
  <!-- Satélite -->
  <g transform="translate(30, 30) rotate(-25)">
    <!-- Corpo do satélite -->
    <rect x="0" y="0" width="15" height="20" fill="#2d5a7b" rx="2"/>
    <rect x="2" y="2" width="11" height="16" fill="#4facfe" opacity="0.3"/>
    <!-- Painel solar -->
    <rect x="-8" y="5" width="8" height="10" fill="#4facfe" opacity="0.5"/>
    <line x1="-8" y1="7.5" x2="0" y2="7.5" stroke="#1e3a5f" stroke-width="0.5"/>
    <line x1="-8" y1="10" x2="0" y2="10" stroke="#1e3a5f" stroke-width="0.5"/>
    <line x1="-8" y1="12.5" x2="0" y2="12.5" stroke="#1e3a5f" stroke-width="0.5"/>
  </g>
  
  <!-- Estrelas -->
  <g fill="#4facfe">
    <!-- Estrela grande centro-direita -->
    <path d="M 130 60 L 132 66 L 138 66 L 133 70 L 135 76 L 130 72 L 125 76 L 127 70 L 122 66 L 128 66 Z" opacity="0.9"/>
    <!-- Estrela média superior -->
    <path d="M 110 35 L 111.5 38 L 114.5 38 L 112 40 L 113.5 43 L 110 41 L 106.5 43 L 108 40 L 105.5 38 L 108.5 38 Z" opacity="0.8"/>
    <!-- Estrela pequena esquerda -->
    <circle cx="45" cy="90" r="2" opacity="0.7"/>
    <!-- Estrelas minúsculas -->
    <circle cx="70" cy="50" r="1.5" opacity="0.6"/>
    <circle cx="150" cy="85" r="1.5" opacity="0.6"/>
    <circle cx="160" cy="110" r="1" opacity="0.5"/>
  </g>
  
  <!-- Planetas pequenos -->
  <circle cx="120" cy="45" r="3" fill="#4facfe" opacity="0.4"/>
  <circle cx="155" cy="75" r="4" fill="#4facfe" opacity="0.3"/>
</svg>




