name = "populate-historical-oceanographic"
main = "populate-historical-oceanographic.js"
compatibility_date = "2024-01-01"
workers_dev = true

# D1 Database binding
[[d1_databases]]
binding = "BGAPP_DATA"
database_name = "bgapp-data"
database_id = "46ed7435-1b25-498d-b832-7bef98061df3"

# Environment variables
[vars]
ALLOWED_ORIGINS = "https://bgapp-admin.pages.dev,https://bgapp-realtime.pages.dev,https://bgapp-frontend.pages.dev"

# Route configuration
routes = [
  { pattern = "populate-historical-oceanographic.majearcasa.workers.dev", zone_name = "majearcasa.workers.dev" }
]

# Limits - Higher CPU for data population
limits = { cpu_ms = 50000 }  # 50 seconds for large batch operations

# Observability
observability = { enabled = true }
