name = "bgapp-api-worker"
main = "bgapp-api-worker.js"
compatibility_date = "2024-01-01"

# Worker configuration
workers_dev = true

# Environment variables (non-sensitive)
[vars]
API_VERSION = "1.0.0"
RATE_LIMIT_REQUESTS = "1000"
RATE_LIMIT_WINDOW = "3600"

# D1 database binding for oceanographic data
[[d1_databases]]
binding = "BGAPP_DATA"
database_name = "bgapp-data"
database_id = "46ed7435-1b25-498d-b832-7bef98061df3"

# Routes configuration - worker accessible at bgapp-api-worker.majearcasa.workers.dev
# Routes will be handled by Cloudflare Workers platform

# Development environment
[env.development]
vars = { API_VERSION = "1.0.0-dev", RATE_LIMIT_REQUESTS = "100" }

# Production environment
[env.production]
vars = { API_VERSION = "1.0.0", RATE_LIMIT_REQUESTS = "1000" }

# Build configuration
[build]
command = ""
watch_paths = ["bgapp-api-worker.js"]

# Compatibility flags for latest features
compatibility_flags = ["nodejs_compat"]
