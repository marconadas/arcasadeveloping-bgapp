name = "nasa-data-populator"
main = "nasa-data-populator.js"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "bgapp-data"
database_id = "46ed7435-1b25-498d-b832-7bef98061df3"

# Service Binding to NASA proxy worker
[[services]]
binding = "NASA_PROXY"
service = "nasa-earthdata-proxy"
environment = ""
